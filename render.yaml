# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: tavernata
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Optional: enables the Claude narrator for computer-DM games.
      - key: ANTHROPIC_API_KEY
        sync: false
